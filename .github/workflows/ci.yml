name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Resolve mobile dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: apps/mobile

      - name: Analyze mobile application
        run: flutter analyze
        working-directory: apps/mobile

      - name: Test mobile application
        run: flutter test
        working-directory: apps/mobile

      - name: Run provider-neutral extraction benchmark
        run: flutter test benchmark/phase6a_reference_benchmark_test.dart
        working-directory: apps/mobile

      - name: Build release Flutter bundle
        run: >-
          flutter build bundle --release
          --dart-define=CONVOCOACH_ENVIRONMENT=production
          --dart-define=CONVOCOACH_MOCK_MODE=false
          --dart-define=CONVOCOACH_COACH_PREVIEW_ENABLED=false
          --dart-define=CONVOCOACH_AUTHENTICATION_MODE=oidc
          --dart-define=CONVOCOACH_API_BASE_URL=https://api.invalid
          --dart-define=CONVOCOACH_OIDC_DISCOVERY_URL=https://identity.invalid/.well-known/openid-configuration
          --dart-define=CONVOCOACH_OIDC_CLIENT_ID=ci-mobile-client
          --dart-define=CONVOCOACH_OIDC_REDIRECT_URL=com.convocoach.convo-coach:/oauthredirect
        working-directory: apps/mobile

      - name: Build unsigned Android release app bundle
        run: >-
          flutter build appbundle --release
          --dart-define=CONVOCOACH_ENVIRONMENT=production
          --dart-define=CONVOCOACH_MOCK_MODE=false
          --dart-define=CONVOCOACH_COACH_PREVIEW_ENABLED=false
          --dart-define=CONVOCOACH_AUTHENTICATION_MODE=oidc
          --dart-define=CONVOCOACH_API_BASE_URL=https://api.invalid
          --dart-define=CONVOCOACH_OIDC_DISCOVERY_URL=https://identity.invalid/.well-known/openid-configuration
          --dart-define=CONVOCOACH_OIDC_CLIENT_ID=ci-mobile-client
          --dart-define=CONVOCOACH_OIDC_REDIRECT_URL=com.convocoach.convo-coach:/oauthredirect
        working-directory: apps/mobile

  backend-and-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://convocoach:convocoach_test@127.0.0.1:5432/convocoach
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: convocoach
          POSTGRES_PASSWORD: convocoach_test
          POSTGRES_USER: convocoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U convocoach -d convocoach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install hash-locked backend and development tools
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend

      - name: Validate installed dependency compatibility
        run: python -m pip check

      - name: Verify the hashed production dependency lock
        run: >-
          python -m pip install --dry-run --require-hashes --no-deps
          -r backend/requirements.lock

      - name: Check Python formatting
        run: ruff format --check backend

      - name: Lint Python
        run: ruff check backend

      - name: Type-check backend
        run: mypy app tests
        working-directory: backend

      - name: Apply and validate PostgreSQL migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade 20260714_0001
          alembic upgrade head
          alembic check
        working-directory: backend

      - name: Test backend and shared tokens
        run: pytest -W error
        working-directory: backend

      - name: Validate Phase 14 release manifest contract
        run: >-
          python -m app.release.cli
          ../release/phase14/release-candidate-manifest.example.json
          --expect-status blocked
        working-directory: backend

      - name: Validate Phase 19 production-aware release manifest contract
        run: >-
          python -m app.release.cli
          ../release/phase19/release-candidate-manifest.current.json
          --expect-status blocked
        working-directory: backend

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build hardened backend container
        run: docker build --file backend/Dockerfile --tag convocoach-backend:ci .

      - name: Validate repository contracts and privacy boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path(".").rglob("*.json"):
              if "/.dart_tool/" not in f"/{path.as_posix()}/":
                  json.loads(path.read_text())
          PY
          ruby -e \
            'require "yaml"; Dir["**/*.{yml,yaml}"].each { |path| YAML.safe_load(File.read(path), aliases: true, filename: path) }'
          ! rg -n --hidden \
            --glob '!backend/.venv/**' \
            --glob '!apps/mobile/.dart_tool/**' \
            --glob '!apps/mobile/build/**' \
            'sk-(proj-)?[A-Za-z0-9_-]{20,}' \
            backend apps/mobile
